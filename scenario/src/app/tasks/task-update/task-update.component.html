<section class="space-y-3">
  <div>
    <h2 class="section-title">Update</h2>
    <p class="section-helper">Paste an id and edit values.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-3">
    <div class="form-field">
      <label for="taskId" class="form-label">Task Id</label>
      <input
        type="text"
        id="taskId"
        name="taskId"
        [(ngModel)]="taskId"
        required
        class="form-input-sky form-input-mono"
      />
    </div>

    <div class="form-field">
      <label for="updateName" class="form-label">Name</label>
      <input
        type="text"
        id="updateName"
        name="name"
        [(ngModel)]="task.name"
        required
        class="form-input-sky"
      />
    </div>

    <div class="form-field">
      <label for="updateDueDate" class="form-label">Due Date</label>
      <input
        type="date"
        id="updateDueDate"
        name="dueDate"
        [(ngModel)]="task.due"
        required
        class="form-input-sky"
      />
    </div>

    <div class="form-field">
      <label for="updateDescription" class="form-label">Description</label>
      <input
        type="text"
        id="updateDescription"
        name="description"
        [(ngModel)]="task.description"
        required
        class="form-input-sky"
      />
    </div>

    <label for="updateComplete" class="checkbox-row">
      <input
        type="checkbox"
        id="updateComplete"
        name="complete"
        [(ngModel)]="task.complete"
        class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-400"
      />
      <span>Mark task as complete</span>
    </label>

    <button
      type="submit"
      class="accent-button"
    >
      Update
    </button>
  </form>
</section>
