<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4">
  <div
    class="app-card w-full max-w-md border-stone-300/70 bg-stone-50/95 p-6 shadow-xl shadow-stone-900/15"
  >
    <div class="space-y-3">
      <h3 class="text-lg font-semibold text-slate-900">Delete to-do?</h3>
      <p class="text-sm leading-6 text-slate-600">
        Are you sure you want to delete
        <span class="font-semibold text-slate-900">"{{ task.name }}"</span>?
        This action cannot be undone.
      </p>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-2">
      <button type="button" (click)="cancel.emit()" class="secondary-button">
        Cancel
      </button>
      <button type="button" (click)="confirmDelete()" class="danger-button">
        Delete
      </button>
    </div>
  </div>
</div>
