<section class="space-y-3">
  <div>
    <h2 class="text-sm font-semibold uppercase tracking-wide text-red-700">Delete by id</h2>
    <p class="mt-1 text-xs text-slate-600">Paste an id to remove a task.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-3">
    <div class="space-y-1.5">
      <label for="deleteTaskId" class="text-sm font-medium text-slate-700">Task Id</label>
      <input
        type="text"
        id="deleteTaskId"
        name="taskId"
        [(ngModel)]="taskId"
        required
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-mono text-sm text-slate-900 shadow-sm outline-none transition focus:border-red-300 focus:ring-4 focus:ring-red-100"
      />
    </div>

    <button
      type="submit"
      class="inline-flex items-center justify-center rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-red-500"
    >
      Delete
    </button>
  </form>
</section>
