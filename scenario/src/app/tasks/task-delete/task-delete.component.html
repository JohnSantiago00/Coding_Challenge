<section class="space-y-3">
  <div>
    <h2 class="section-title-danger">Delete by id</h2>
    <p class="section-helper">Paste an id to remove a task.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-3">
    <div class="form-field">
      <label for="deleteTaskId" class="form-label">Task Id</label>
      <input
        type="text"
        id="deleteTaskId"
        name="taskId"
        [(ngModel)]="taskId"
        required
        class="form-input-danger form-input-mono"
      />
    </div>

    <button
      type="submit"
      class="danger-button"
    >
      Delete
    </button>
  </form>
</section>
