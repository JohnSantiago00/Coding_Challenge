<section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
  <div class="border-b border-slate-200 pb-3">
    <div>
      <h2 class="text-xl font-semibold tracking-tight text-slate-900 sm:text-2xl">Tasks</h2>
      <p class="text-sm text-slate-600">Manage your tasks in one place.</p>
    </div>
  </div>

  <div class="mt-4 space-y-2.5">
    @for (task of tasks$ | async; track $index) {
    <article class="rounded-xl border border-slate-200 bg-slate-50/80 p-3.5 transition hover:border-slate-300">
      @if (editingTaskId === task._id) {
      <form (ngSubmit)="saveEdit(task._id)" class="space-y-3">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <h3 class="text-base font-semibold text-slate-900">Editing Task</h3>
          <span class="inline-flex items-center rounded-full bg-sky-100 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide text-sky-700">
            Edit mode
          </span>
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium text-slate-700" [attr.for]="'edit-name-' + task._id">Name</label>
          <input
            type="text"
            [attr.id]="'edit-name-' + task._id"
            name="editName"
            [(ngModel)]="editedTask.name"
            required
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-300 focus:ring-4 focus:ring-sky-100"
          />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium text-slate-700" [attr.for]="'edit-due-' + task._id">Due Date</label>
          <input
            type="date"
            [attr.id]="'edit-due-' + task._id"
            name="editDueDate"
            [(ngModel)]="editedTask.due"
            required
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-300 focus:ring-4 focus:ring-sky-100"
          />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium text-slate-700" [attr.for]="'edit-description-' + task._id">Description</label>
          <input
            type="text"
            [attr.id]="'edit-description-' + task._id"
            name="editDescription"
            [(ngModel)]="editedTask.description"
            required
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-300 focus:ring-4 focus:ring-sky-100"
          />
        </div>

        <label class="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700" [attr.for]="'edit-complete-' + task._id">
          <input
            type="checkbox"
            [attr.id]="'edit-complete-' + task._id"
            name="editComplete"
            [(ngModel)]="editedTask.complete"
            class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-400"
          />
          <span>Mark task as complete</span>
        </label>

        <div class="flex flex-wrap gap-2">
          <button
            type="submit"
            class="inline-flex items-center justify-center rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-500"
          >
            Save
          </button>
          <button
            type="button"
            (click)="cancelEdit()"
            class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
          >
            Cancel
          </button>
        </div>
      </form>
      } @else {
      <div class="space-y-3">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-3">
            <h3 class="text-base font-semibold text-slate-900 sm:text-lg">{{ task.name }}</h3>
            <span
              class="inline-flex w-fit items-center rounded-full px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide"
              [class.bg-emerald-100]="task.complete"
              [class.text-emerald-700]="task.complete"
              [class.bg-amber-100]="!task.complete"
              [class.text-amber-700]="!task.complete"
            >
              {{ task.complete ? 'Complete' : 'Incomplete' }}
            </span>
          </div>
          <p class="text-sm text-slate-600">Due date: {{ task.due | date:'MMM d, y' }}</p>
        </div>

        <div>
          <p class="text-sm leading-6 text-slate-700">{{ task.description }}</p>
        </div>

        <div class="flex flex-wrap gap-2 pt-1">
          <button
            type="button"
            (click)="toggleComplete(task)"
            class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
          >
            {{ task.complete ? 'Mark Incomplete' : 'Mark Complete' }}
          </button>
          <button
            type="button"
            (click)="startEdit(task)"
            class="inline-flex items-center justify-center rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-500"
          >
            Edit
          </button>
          <button
            type="button"
            (click)="deleteTask(task)"
            class="inline-flex items-center justify-center rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-red-500"
          >
            Delete
          </button>
        </div>
      </div>
      }
    </article>
    }
  </div>
</section>
