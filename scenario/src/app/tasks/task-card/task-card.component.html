<div class="space-y-3">
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex flex-wrap items-center gap-2.5">
      <h3 class="text-base pl-1.5 font-semibold text-slate-900 sm:text-lg">
        {{ task.name }}
      </h3>
      <span
        class="inline-flex w-fit items-center rounded-full px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide"
        [class.bg-emerald-100]="task.complete"
        [class.text-emerald-700]="task.complete"
        [class.bg-amber-100]="!task.complete"
        [class.text-amber-700]="!task.complete"
      >
        {{ task.complete ? "Complete" : "Incomplete" }}
      </span>
    </div>
    <p class="text-sm text-slate-600">Due date: {{ formattedDueDate }}</p>
  </div>

  <p
    class="text-sm pl-1.5 leading-6 text-slate-700 break-words [overflow-wrap:anywhere] whitespace-pre-wrap"
  >
    {{ task.description }}
  </p>

  <div class="flex flex-wrap items-center gap-2 pt-1">
    <button type="button" (click)="toggleComplete.emit()" class="secondary-button">
      {{ task.complete ? "Mark Incomplete" : "Mark Complete" }}
    </button>
    <button type="button" (click)="edit.emit()" class="accent-button">
      Edit
    </button>
    <button type="button" (click)="delete.emit()" class="danger-button">
      Delete
    </button>
  </div>
</div>
