<main class="min-h-screen bg-[#16181D] px-4 py-6 sm:px-6 lg:px-8">
  @if (toast$ | async; as toastMessage) {
    <div
      class="fixed left-1/2 top-4 z-50 w-full max-w-sm -translate-x-1/2 px-4"
    >
      <div
        class="app-card flex w-full items-start justify-between gap-3 border-stone-300/70 bg-stone-50/95 px-4 py-3"
      >
        <p class="text-sm font-medium text-slate-800">{{ toastMessage }}</p>
        <button
          type="button"
          (click)="clearToast()"
          class="text-sm font-semibold text-slate-500 transition hover:text-slate-700"
        >
          Dismiss
        </button>
      </div>
    </div>
  }

  <div class="mx-auto max-w-7xl">
    <header
      class="app-card mb-5 flex flex-col gap-3 px-4 py-3 backdrop-blur-sm sm:flex-row sm:items-center sm:justify-between sm:px-5"
    >
      <a
        routerLink="/"
        class="inline-flex items-center text-lg font-semibold tracking-tight text-slate-900 transition hover:text-teal-700"
      >
        To-Do List
      </a>

      @if (currentUser$ | async; as currentUser) {
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
          <span
            class="inline-flex items-center rounded-full border border-stone-300/70 bg-white/80 px-3 py-1 text-sm font-medium text-slate-600"
          >
            Signed in as {{ currentUser.email }}
          </span>
          <button type="button" (click)="logout()" class="secondary-button">
            Log out
          </button>
        </div>
      } @else {
        <div class="flex flex-wrap items-center gap-2">
          <a routerLink="/login" class="secondary-button">Log in</a>
          <a routerLink="/signup" class="primary-button">Sign up</a>
        </div>
      }
    </header>

    <router-outlet></router-outlet>
  </div>
</main>
