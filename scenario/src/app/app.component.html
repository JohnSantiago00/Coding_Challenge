<main class="min-h-screen bg-[#16181D] px-4 py-6 sm:px-6 lg:px-8">
  @if (toast$ | async; as toastMessage) {
    <div
      class="fixed left-1/2 top-4 z-50 w-full max-w-sm -translate-x-1/2 px-4"
    >
      <div
        class="flex w-full items-start justify-between gap-3 rounded-2xl border border-stone-300/70 bg-stone-50/95 px-4 py-3 shadow-lg shadow-stone-900/10"
      >
        <p class="text-sm font-medium text-slate-800">{{ toastMessage }}</p>
        <button
          type="button"
          (click)="clearToast()"
          class="text-sm font-semibold text-slate-500 transition hover:text-slate-700"
        >
          Dismiss
        </button>
      </div>
    </div>
  }

  <div class="mx-auto max-w-7xl">
    <section
      class="mb-5 rounded-2xl border border-stone-300/60 bg-stone-50/90 p-4 text-center shadow-lg shadow-stone-900/10 backdrop-blur-sm sm:p-5"
    >
      <div class="mx-auto flex max-w-3xl justify-center">
        <div class="w-full space-y-2 text-center">
          <div class="space-y-1.5">
            <h1
              class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl"
            >
              Task Manager
            </h1>
            <p class="mx-auto max-w-2xl text-sm text-slate-600 sm:text-base">
              Stay organized and manage your tasks in one place
            </p>
            @if (currentUser$ | async; as currentUser) {
              <div class="flex flex-wrap items-center justify-center gap-2 text-sm text-slate-600">
                <span>Signed in as {{ currentUser.email }}</span>
                <button
                  type="button"
                  (click)="logout()"
                  class="font-semibold text-teal-700 transition hover:text-teal-600"
                >
                  Log out
                </button>
              </div>
            } @else {
              <div class="flex flex-wrap items-center justify-center gap-3 text-sm">
                <a routerLink="/login" class="font-semibold text-teal-700 transition hover:text-teal-600">
                  Log in
                </a>
                <a routerLink="/signup" class="font-semibold text-teal-700 transition hover:text-teal-600">
                  Sign up
                </a>
              </div>
            }
          </div>
        </div>
      </div>
    </section>

    <router-outlet></router-outlet>
  </div>
</main>
