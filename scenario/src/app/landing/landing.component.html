<section class="mx-auto max-w-4xl">
  <div class="app-card p-6 sm:p-8">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl">
        Organize your day without the clutter
      </h2>
      <p class="mt-3 text-base leading-7 text-slate-600 sm:text-lg">
        Plan your to-dos, track due dates, and keep your day moving.
      </p>
      @if (currentUser$ | async; as currentUser) {
        <p class="mt-4 text-sm font-medium text-slate-600">
          Signed in as {{ currentUser.email }}
        </p>
      }
    </div>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      @if (currentUser$ | async) {
        <a routerLink="/tasks" class="accent-button w-full sm:w-auto">Open my list</a>
      } @else {
        <a routerLink="/signup" class="primary-button w-full sm:w-auto">Get started</a>
        <a routerLink="/login" class="secondary-button w-full sm:w-auto">Log in</a>
      }
    </div>
  </div>
</section>
