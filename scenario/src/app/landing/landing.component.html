<section class="mx-auto max-w-4xl">
  <div
    class="rounded-2xl border border-stone-300/60 bg-stone-50/90 p-6 shadow-lg shadow-stone-900/10 sm:p-8"
  >
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl">
        Organize your work without the clutter
      </h2>
      <p class="mt-3 text-base leading-7 text-slate-600 sm:text-lg">
        Plan tasks, track due dates, and keep everything in one calm, focused
        workspace.
      </p>
      @if (currentUser$ | async; as currentUser) {
        <p class="mt-3 text-sm text-slate-600">
          Signed in as {{ currentUser.email }}
        </p>
      }
    </div>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      @if (currentUser$ | async) {
        <a routerLink="/tasks" class="accent-button w-full sm:w-auto">Open dashboard</a>
      } @else {
        <a routerLink="/login" class="primary-button w-full sm:w-auto">Log in</a>
        <a routerLink="/signup" class="secondary-button w-full sm:w-auto">Sign up</a>
        <a routerLink="/tasks" class="accent-button w-full sm:w-auto">View demo tasks</a>
      }
    </div>
  </div>
</section>
