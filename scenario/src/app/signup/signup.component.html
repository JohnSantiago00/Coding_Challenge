<section class="mx-auto max-w-md">
  <div
    class="rounded-2xl border border-stone-300/60 bg-stone-50/90 p-6 shadow-lg shadow-stone-900/10 sm:p-7"
  >
    <div class="text-center">
      <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Sign up</h2>
      <p class="mt-2 text-sm text-slate-600">
        Auth will be connected in the next phase. This is the signup page shell.
      </p>
    </div>

    <form (submit)="handleSubmit($event)" class="mt-6 space-y-4">
      <div class="form-field">
        <label for="signupEmail" class="form-label">Email</label>
        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          class="form-input"
          placeholder="you@example.com"
        />
      </div>

      <div class="form-field">
        <label for="signupPassword" class="form-label">Password</label>
        <input
          id="signupPassword"
          type="password"
          autocomplete="new-password"
          class="form-input"
          placeholder="Create a password"
        />
      </div>

      <div class="form-field">
        <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
        <input
          id="signupConfirmPassword"
          type="password"
          autocomplete="new-password"
          class="form-input"
          placeholder="Repeat your password"
        />
      </div>

      <button type="submit" class="primary-button w-full">Create account</button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-600">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-teal-700 transition hover:text-teal-600">
        Log in
      </a>
    </p>
  </div>
</section>
